<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melos — prototype design v2 (sobre)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ease: cubic-bezier(.32, .72, 0, 1);
    --t1: rgba(255,255,255,.96);
    --t2: rgba(255,255,255,.62);
    --t3: rgba(255,255,255,.38);
    --line: rgba(255,255,255,.10);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #000; color: var(--t1); font-family: Inter, -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; padding: 20px; }
  .bar { max-width: 1280px; margin: 0 auto 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--t3); }
  .bar strong { color: var(--t2); font-weight: 500; margin-right: auto; }
  .bar button { background: rgba(255,255,255,.08); color: var(--t1); border: 0; border-radius: 8px; padding: 7px 12px; font: 500 13px Inter, sans-serif; cursor: pointer; }
  .bar button:hover { background: rgba(255,255,255,.14); }

  /* ---------- Écran principal ---------- */
  .stage { container-type: inline-size; position: relative; max-width: 1280px; margin: 0 auto; aspect-ratio: 16/9; overflow: hidden;
    border-radius: 14px; background: #0c0c0d; isolation: isolate; }
  .bg { position: absolute; inset: -10%; z-index: -1; background-size: cover; background-position: center;
    filter: blur(9cqw) saturate(1.5) brightness(.55); transform: scale(1.1); opacity: 0; transition: opacity 1.2s var(--ease); }
  .bg::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.25); }
  .reveal .bg { opacity: 1; }

  .grid { position: absolute; inset: 0; display: grid; grid-template-columns: 52% 48%; }
  .left { position: relative; }
  .disc-wrap { position: absolute; left: 9cqw; top: 50%; width: 40cqw; aspect-ratio: 1; transform: translateY(-50%);
    transition: transform 1s var(--ease); }
  .reveal .disc-wrap { transform: translate(-11cqw, -50%) scale(.92); }
  .sheen { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 30deg, transparent, rgba(255,255,255,.05) 12%, transparent 25%, transparent 50%, rgba(255,255,255,.04) 62%, transparent 75%);
    -webkit-mask: radial-gradient(circle, transparent 34%, #000 35%); mask: radial-gradient(circle, transparent 34%, #000 35%); }
  .disc, .disc svg { width: 100%; height: 100%; display: block; }
  .cover { position: absolute; left: 9cqw; top: 50%; width: 40cqw; aspect-ratio: 1; border-radius: .7cqw; overflow: hidden;
    background-size: cover; background-position: center;
    box-shadow: 0 2.5cqw 6cqw rgba(0,0,0,.45), 0 .3cqw 1cqw rgba(0,0,0,.25);
    opacity: 0; transform: translateY(-50%) scale(.94); transition: opacity .7s var(--ease), transform 1s var(--ease); }
  .reveal .cover { opacity: 1; transform: translateY(-50%) scale(1); transition-delay: .15s; }

  .right { position: relative; padding: 6cqw 7cqw 6cqw 2cqw; }
  .panel { position: absolute; inset: 6cqw 7cqw 6cqw 2cqw; display: flex; flex-direction: column; transition: opacity .5s var(--ease), transform .7s var(--ease); }
  .caption { font-size: 1.15cqw; font-weight: 500; color: var(--t2); display: flex; justify-content: space-between; }
  .caption span:last-child { color: var(--t3); letter-spacing: .08em; }

  .play-panel .center { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .count { font-size: 11cqw; font-weight: 600; letter-spacing: -.05em; line-height: .9; font-variant-numeric: tabular-nums; }
  .progress { height: 2px; background: var(--line); border-radius: 2px; margin: 2.4cqw 0 1.6cqw; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 100%; background: var(--t1); transform-origin: left; }
  .state { font-size: 2.2cqw; font-weight: 600; letter-spacing: -.02em; min-height: 3cqw; }
  .state .who { transition: color .3s; }
  .state small { display: block; font-size: 1.2cqw; font-weight: 500; color: var(--t3); letter-spacing: 0; margin-top: .4cqw; }

  .players { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .p { display: grid; grid-template-columns: 2.6cqw 1fr auto; gap: 1.2cqw; align-items: center; padding: 1cqw 0; border-bottom: 1px solid var(--line);
    font-size: 1.45cqw; font-weight: 500; transition: opacity .4s var(--ease); }
  .p .av { width: 2.6cqw; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: 1cqw; font-weight: 600;
    background: rgba(255,255,255,.10); color: var(--t2); transition: background .3s, color .3s; }
  .p b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .dim .p { opacity: .35; }
  .dim .p.on { opacity: 1; }
  .p.on .av { background: var(--t1); color: #000; }

  .reveal-panel { opacity: 0; transform: translateY(1.2cqw); pointer-events: none; justify-content: center; }
  .reveal .play-panel { opacity: 0; transform: translateY(-1.2cqw); pointer-events: none; }
  .reveal .reveal-panel { opacity: 1; transform: none; transition-delay: .35s; }
  .reveal-panel .caption { position: absolute; top: 0; left: 0; right: 0; }
  .title { font-size: 5cqw; font-weight: 700; letter-spacing: -.035em; line-height: 1; margin: 0 0 1cqw; }
  .artist { font-size: 2.3cqw; font-weight: 500; color: var(--t2); margin: 0 0 .5cqw; letter-spacing: -.01em; }
  .album { font-size: 1.4cqw; color: var(--t3); margin: 0 0 3.2cqw; }
  .line2 { opacity: 0; transform: translateY(.8cqw); transition: opacity .6s var(--ease), transform .8s var(--ease); }
  .reveal .line2 { opacity: 1; transform: none; transition-delay: .55s; }
  .actions { display: flex; gap: 1cqw; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: .8cqw; padding: .9cqw 1.6cqw .9cqw .9cqw; border-radius: 99px;
    background: rgba(255,255,255,.14); font-size: 1.35cqw; font-weight: 600; }
  .pill .av { width: 2.2cqw; aspect-ratio: 1; border-radius: 50%; background: var(--t1); color: #000; display: grid; place-items: center; font-size: .9cqw; }
  .pill em { font-style: normal; color: var(--t2); font-variant-numeric: tabular-nums; }
  .spotify { font-size: 1.2cqw; font-weight: 500; color: var(--t2); display: inline-flex; gap: .6cqw; align-items: center; }
  .spotify i { width: 1.6cqw; aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--t3); }

  /* ---------- Téléphones ---------- */
  .phones { max-width: 1280px; margin: 24px auto 0; display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  .ph { text-align: center; font-size: 12px; color: var(--t3); }
  .screen { width: 200px; height: 420px; border-radius: 32px; overflow: hidden; margin-bottom: 10px; position: relative; border: 1px solid #222;
    display: flex; flex-direction: column; padding: 18px; color: #000; transition: background .35s var(--ease); }
  .screen .top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
  .screen .top span:last-child { font-variant-numeric: tabular-nums; opacity: .6; }
  .screen .mid { flex: 1; display: grid; place-items: center; text-align: center; }
  .screen .big { font-size: 44px; font-weight: 700; letter-spacing: -.04em; }
  .screen .sub { font-size: 13px; font-weight: 500; opacity: .6; margin-top: 4px; }
  .tap { cursor: pointer; user-select: none; }
  .tap:active { filter: brightness(.92); }
  .s-ready { background: #ff5b3a; }
  .s-mine { background: #fff; }
  .s-locked { background: #161617; color: var(--t1); }
  .s-text { background: #161617; color: var(--t1); }
  .s-text input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 0; background: rgba(255,255,255,.10); color: var(--t1); font: 500 15px Inter, sans-serif; margin-bottom: 8px; }
  .s-text button { width: 100%; padding: 13px; border-radius: 12px; border: 0; background: #fff; color: #000; font: 600 15px Inter, sans-serif; }
</style>
</head>
<body>

<div class="bar">
  <strong>Melos · prototype v2</strong>
  <button onclick="play()">Lancer l'extrait</button>
  <button onclick="buzz()">Buzz Camille</button>
  <button onclick="reveal()">Révéler</button>
  <button onclick="reset()">Manche suivante</button>
  <button onclick="demo()">Démo</button>
</div>

<main class="stage" id="stage">
  <div class="bg" id="bg"></div>
  <div class="grid">
    <section class="left">
      <div class="disc-wrap">
        <svg class="disc" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <radialGradient id="g" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#151516"/><stop offset="1" stop-color="#0a0a0a"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="50" fill="url(#g)"/>
          <g id="spin">
            <g fill="none" stroke="#fff" stroke-opacity=".07" stroke-width=".12" id="grooves"></g>
            <circle cx="50" cy="50" r="17" fill="#ece9e4"/>
            <text x="50" y="44" text-anchor="middle" font-family="Inter" font-weight="600" font-size="3.2" fill="#111" letter-spacing=".4">MELOS</text>
            <text x="50" y="59" text-anchor="middle" font-family="Inter" font-weight="500" font-size="2.2" fill="#111" fill-opacity=".5" id="labelRound">MANCHE 04</text>
          </g>
          <circle cx="50" cy="50" r="1.3" fill="#0c0c0d"/>
        </svg>
        <div class="sheen"></div>
      </div>
      <div class="cover" id="cover"></div>
    </section>

    <section class="right">
      <div class="panel play-panel">
        <div class="caption"><span id="roundTxt">Manche 4 sur 10</span><span>K7RX</span></div>
        <div class="center">
          <div class="count" id="count">30</div>
          <div class="progress"><i id="prog"></i></div>
          <div class="state" id="state">Prêts ?<small>L'extrait démarre à un moment aléatoire</small></div>
        </div>
        <div class="players" id="players"></div>
      </div>

      <div class="panel reveal-panel">
        <div class="caption"><span>C'était</span><span></span></div>
        <h2 class="title" id="title">Golden Hour</h2>
        <div class="line2">
          <p class="artist" id="artist">The Night Shift</p>
          <p class="album" id="album">Low Tide · 2019</p>
          <div class="actions">
            <span class="pill" id="win"><span class="av">CA</span>Camille <em>+1</em></span>
            <span class="spotify"><i></i>Écouter sur Spotify</span>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<section class="phones">
  <div class="ph"><div class="screen s-ready tap" id="myPhone" onclick="buzz()"><div class="top"><span>Camille</span><span id="myPts">8</span></div><div class="mid" id="myMid"><div><div class="big">Buzz</div><div class="sub">Tout l'écran est le bouton</div></div></div></div>Buzzer (cliquable)</div>
  <div class="ph"><div class="screen s-locked"><div class="top"><span>Léo</span><span>6</span></div><div class="mid"><div><div class="big" style="font-size:28px">Camille</div><div class="sub">a la main</div></div></div></div>Un autre a buzzé</div>
  <div class="ph"><div class="screen s-text"><div class="top"><span>Sam</span><span>3</span></div><div class="mid" style="align-content:end"><div style="width:100%"><input placeholder="Titre ou artiste"><button>Envoyer</button></div></div></div>Mode texte</div>
</section>

<script>
  // Image de démonstration uniquement (photo Unsplash via Picsum). Dans l'app : la pochette renvoyée par l'API Spotify.
  const COVER = 'https://picsum.photos/seed/melos-golden/900/900';
  const DURATION = 30;
  const players = [
    { id: 'p1', name: 'Camille', s: 8 }, { id: 'p2', name: 'Léo', s: 6 },
    { id: 'p3', name: 'Sam', s: 3 }, { id: 'p4', name: 'Inès', s: 2 },
  ];
  const $ = id => document.getElementById(id);
  const stage = $('stage');
  let round = 4, state = 'idle', buzzer = null, left = DURATION, last = 0, raf = 0;

  $('cover').style.backgroundImage = $('bg').style.backgroundImage = `url(${COVER})`;
  const grooves = $('grooves');
  for (let r = 19; r < 48.5; r += .55) grooves.insertAdjacentHTML('beforeend', `<circle cx="50" cy="50" r="${r.toFixed(2)}"/>`);

  // Rotation : 33 tours/min, accélération et freinage progressifs via playbackRate.
  const spin = $('spin').animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 1818, iterations: Infinity });
  $('spin').style.transformOrigin = '50px 50px';
  spin.playbackRate = 0;
  function ramp(to, ms) {
    const from = spin.playbackRate, t0 = performance.now();
    (function step(t) {
      const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      spin.playbackRate = from + (to - from) * e;
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  const initials = n => n.slice(0, 2).toUpperCase();
  function renderPlayers(on) {
    const list = $('players');
    list.classList.toggle('dim', !!on);
    list.innerHTML = [...players].sort((a, b) => b.s - a.s).map(p =>
      `<div class="p ${p.id === on ? 'on' : ''}"><span class="av">${initials(p.name)}</span><span>${p.name}</span><b>${p.s}</b></div>`).join('');
  }
  const setState = (t, sub) => $('state').innerHTML = `${t}<small>${sub}</small>`;
  function setPhone(cls, html) { const ph = $('myPhone'); ph.className = 'screen tap ' + cls; $('myMid').innerHTML = html; }

  function tick(t) {
    if (state !== 'playing') return;
    if (last) left = Math.max(0, left - (t - last) / 1000);
    last = t;
    $('count').textContent = Math.ceil(left);
    $('prog').style.transform = `scaleX(${left / DURATION})`;
    if (left <= 0) return reveal();
    raf = requestAnimationFrame(tick);
  }

  function play() {
    if (state !== 'idle') return;
    state = 'playing'; last = 0;
    ramp(1, 1600);
    setState('À l\'écoute', 'Buzzez dès que vous reconnaissez');
    renderPlayers(); raf = requestAnimationFrame(tick);
  }

  function buzz() {
    if (state === 'idle') { play(); return setTimeout(buzz, 2500); }
    if (state !== 'playing') return;
    state = 'buzzed'; buzzer = 'p1'; cancelAnimationFrame(raf);
    ramp(0, 700);
    setState('<span class="who">Camille</span> a la main', 'Le maître du jeu valide la réponse');
    setPhone('s-mine', '<div><div class="big">À toi</div><div class="sub">Réponds à voix haute</div></div>');
    renderPlayers('p1');
  }

  function reveal() {
    if (state === 'reveal') return;
    const winner = buzzer; state = 'reveal'; cancelAnimationFrame(raf);
    ramp(.25, 900);
    $('win').style.display = winner ? '' : 'none';
    stage.classList.add('reveal');
    if (winner) setTimeout(() => { players.find(p => p.id === winner).s++; $('myPts').textContent = players[0].s; renderPlayers(); }, 900);
  }

  function reset() {
    stage.classList.remove('reveal'); ramp(0, 400);
    round = Math.min(10, round + 1); state = 'idle'; buzzer = null; left = DURATION;
    $('roundTxt').textContent = `Manche ${round} sur 10`;
    $('labelRound').textContent = `MANCHE ${String(round).padStart(2, '0')}`;
    $('count').textContent = DURATION; $('prog').style.transform = 'scaleX(1)';
    setState('Prêts ?', 'L\'extrait démarre à un moment aléatoire');
    setPhone('s-ready', '<div><div class="big">Buzz</div><div class="sub">Tout l\'écran est le bouton</div></div>');
    renderPlayers();
  }

  function demo() { reset(); setTimeout(play, 500); setTimeout(buzz, 4500); setTimeout(reveal, 6500); }
  renderPlayers();
</script>
</body>
</html>
